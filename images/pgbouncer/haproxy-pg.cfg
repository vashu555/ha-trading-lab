# Finds the PostgreSQL leader: Patroni's REST API answers 200 on /primary only on the leader.
global
    maxconn 400
defaults
    mode tcp
    timeout connect 2s
    timeout client 30m
    timeout server 30m
    timeout check 1s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 2
    timeout resolve 1s
    hold valid 2s
    hold nx 1s
    hold other 1s
listen primary
    bind 127.0.0.1:5000
    option httpchk GET /primary
    http-check expect status 200
    # check every 0.5 s; when a server stops being the leader, cut its sessions so PgBouncer reconnects to the new one
    default-server inter 500ms fall 2 rise 1 on-marked-down shutdown-sessions resolvers docker init-addr none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008
