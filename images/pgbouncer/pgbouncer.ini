[databases]
trading = host=127.0.0.1 port=5000 dbname=trading

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = app
stats_users = app
; transaction pooling: a server connection is lent for one transaction, then returned
pool_mode = transaction
max_client_conn = 400
default_pool_size = 15
reserve_pool_size = 5
; during a failover: give up on a client after 5 s (it retries), try the leader again every second
query_wait_timeout = 5
server_connect_timeout = 2
server_login_retry = 1
server_lifetime = 300
server_idle_timeout = 30
ignore_startup_parameters = extra_float_digits,options
logfile =
log_connections = 0
log_disconnections = 0
