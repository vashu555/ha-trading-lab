# pgBackRest: continuous WAL archiving + a full backup daily and an incremental every 30 min (control.py schedules them).
# In the lab the repository is a Docker volume shared by the three nodes, standing in for object storage
# (an Azure Blob container in another region). In production: repo1-type=azure (or s3) + encryption.
[global]
repo1-path=/backup/repo
repo1-retention-full=1
start-fast=y
compress-type=lz4
log-level-console=info
log-level-file=off
lock-path=/tmp/pgbackrest

[tradelab]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-socket-path=/var/run/postgresql
