# 3-node RabbitMQ cluster (rabbit-1 Azure z1, rabbit-2 Azure z2, rabbit-3 Oracle Mumbai)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3
# a node cut off from the majority pauses itself instead of carrying on alone (no split brain)
cluster_partition_handling = pause_minority
default_user = lab
default_pass = lab
loopback_users = none
vm_memory_high_watermark.absolute = 230MiB
disk_free_limit.absolute = 1GB
queue_leader_locator = balanced
log.console.level = warning
