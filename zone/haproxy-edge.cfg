# Edge load balancer (haproxy-1 in Azure zone 1, haproxy-2 in Azure zone 2). Traders know both addresses.
global
    maxconn 2000
defaults
    mode http
    timeout connect 2s
    timeout client 30s
    timeout server 10s
    option http-server-close
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 2
    timeout resolve 1s
    hold valid 2s
    hold nx 1s
    hold other 1s
frontend web
    bind :8080
    default_backend apis
backend apis
    balance roundrobin                 # each request to the next API server in turn
    option httpchk GET /health         # health check every second; 2 failures = out, 2 successes = back in
    # Retry on another API server when one dies mid-request. Safe here because every write is idempotent
    # (an order carries its client_ref; a resend returns the same order). Without idempotency: never retry POSTs.
    retries 2
    retry-on conn-failure empty-response response-timeout
    option redispatch 1
    timeout server 5s
    default-server inter 1s fall 2 rise 2 resolvers docker init-addr none
    server api-1 api-1:8001 check
    server api-2 api-2:8002 check
    server api-3 api-3:8003 check
    server api-4 api-4:8004 check
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
